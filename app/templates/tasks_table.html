{% extends "base.html" %}{% block content %}<main class="page-shell"><section class="page-title"><div><h1>المهام كجدول</h1><p>عرض كثيف شبيه بالشيت، مرتب حسب الموظف صاحب أكبر عدد مهام.</p></div><div class="toolbar"><input id="q" placeholder="بحث"><select id="status"><option value="">كل الحالات</option><option>جديدة</option><option>بدأت</option><option>قيد التنفيذ</option><option>بانتظار</option><option>تم</option><option>ملغاة</option></select></div></section><div class="bim-section"><div class="scroll-box"><table class="sticky-table"><thead><tr><th>#</th><th>الموظف</th><th>المهمة</th><th>الحالة</th><th>الأولوية</th><th>الموعد</th><th>التذكير</th></tr></thead><tbody id="body"></tbody></table></div></div></main>{% endblock %}
{% block scripts %}
<script>document.documentElement.dataset.bimExcelPage="tasks_table";</script>

<script>
let rows=[];const params=new URLSearchParams(location.search);q.value=params.get('q')||params.get('employee')||'';
async function load(){rows=await fetch('/api/tasks').then(r=>r.json());render()}function render(){const filtered=rows.filter(t=>(!q.value||(`${t.employee_name} ${t.title}`).includes(q.value))&&(!status.value||t.status===status.value));const counts={};filtered.forEach(t=>counts[t.employee_name]=(counts[t.employee_name]||0)+1);filtered.sort((a,b)=>(counts[b.employee_name]||0)-(counts[a.employee_name]||0)||a.employee_name.localeCompare(b.employee_name,'ar')||b.id-a.id);body.innerHTML=filtered.map(t=>`<tr><td>${bimArDigits(t.id)}</td><td class="name-red">${t.employee_id?bimEmpLink(t.employee_id,t.employee_name):bimEsc(t.employee_name)}</td><td>${window.bimOriginBadge?bimOriginBadge(t):''}<a href="/task/${t.id}">${bimEsc(t.title)}</a>${t.last_delegation?`<div class="muted-mini">${bimDelegationText(t)}</div>`:''}</td><td>${bimEsc(t.status)}</td><td>${bimEsc(t.priority)}</td><td class="ar-date">${bimDate(t.due_at)}</td><td>${bimEsc(t.reminder_label||'بدون')}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد مهام</td></tr>'}q.oninput=render;status.onchange=render;load();
</script>{% endblock %}
