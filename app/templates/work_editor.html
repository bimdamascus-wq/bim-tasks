<script>
const workLabels={permissions:{start:'بدء المهمة',progress:'تحديث تقدم العمل',complete:'إنجاز المهمة',comment:'إضافة ملاحظة',attach:'إرفاق ملف'},notifications:{tasks:'المهام الجديدة',reminders:'التذكيرات',shift_start:'بداية الدوام',shift_end:'نهاية الدوام'}};
function workEsc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawWorkEditor(id,cfg={},individual=false){
 const root=document.getElementById(id);root.dataset.individual=individual?'1':'0';root._templates=cfg.task_templates||[];
 const toggle=(key,label)=>individual?`<label><input type="checkbox" data-override="${key}" ${Object.hasOwn(cfg,key)?'checked':''}> تخصيص ${label} لهذا الموظف</label>`:`<h4>${label}</h4>`;
 root.innerHTML=`<details ${individual?'':'open'}><summary>التعليمات والصلاحيات والتنبيهات ونموذج الإنجاز</summary>
 <p>${individual?'اترك التخصيص غير محدد لاستخدام إعداد الوظائف. تخصيصك يبقى عند تعديل الوظيفة.':'هذه إعدادات العمل للموظفين، ولا تمنح صلاحيات إدارة النظام.'}</p>
 ${toggle('instructions','التعليمات')}<textarea data-work="instructions" rows="4" maxlength="24000" placeholder="تعليمات العمل">${workEsc(cfg.instructions||'')}</textarea>
 ${['permissions','notifications'].map(key=>`<section>${toggle(key,key==='permissions'?'صلاحيات العمل':'التنبيهات')}<div class="toolbar" style="flex-wrap:wrap">${Object.entries(workLabels[key]).map(([k,l])=>`<label><input type="checkbox" data-work="${key}.${k}" ${cfg[key]?.[k]!==false?'checked':''}> ${l}</label>`).join('')}</div></section>`).join('')}
 ${toggle('completion_fields','نموذج الإنجاز')}<p>حقول اختيارية، حقل بكل سطر (مثل النتيجة، الكمية، ملاحظة). الإنجاز فوري دون موافقة.</p><textarea data-work="completion_fields" rows="3">${workEsc((cfg.completion_fields||[]).join('\n'))}</textarea></details>
 ${individual?'':'<details><summary>المهام الثابتة السابقة للوظيفة</summary><p>هذه التعريفات السابقة محفوظة للتوافق. للقوالب المستقلة ذات الإصدارات والربط الجماعي، افتح <a href="/template-library">قوالب العمل</a>.</p><div class="work-templates"></div><button type="button" class="work-add">＋ مهمة ثابتة</button></details>'}`;
 if(!individual){root.querySelector('.work-add').onclick=()=>{root._templates=readWorkTemplates(root);root._templates.push({key:(globalThis.crypto?.randomUUID?.()||'task-'+Date.now()+'-'+Math.random().toString(16).slice(2)),title:'',recurrence_type:'يومي',run_time:'09:00',workdays_only:true});drawWorkTemplates(root)};drawWorkTemplates(root)}
}
function drawWorkTemplates(root){root.querySelector('.work-templates').innerHTML=root._templates.map((t,i)=>`<fieldset data-template-key="${workEsc(t.key||'task-'+(i+1))}"><legend>مهمة ${i+1}</legend><div class="form-grid"><label>العنوان<input data-t="title" value="${workEsc(t.title)}"></label><label>التكرار<select data-t="recurrence_type">${['يومي','أسبوعي','شهري'].map(v=>`<option ${t.recurrence_type===v?'selected':''}>${v}</option>`).join('')}</select></label><label>الوقت<input type="time" data-t="run_time" value="${workEsc(t.run_time||'09:00')}"></label><label>اليوم الأسبوعي<select data-t="week_day">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map((v,k)=>`<option value="${k}" ${Number(t.week_day||0)===k?'selected':''}>${v}</option>`).join('')}</select></label><label>اليوم الشهري<input type="number" min="1" max="31" data-t="month_day" value="${Number(t.month_day||1)}"></label><label>الأولوية<select data-t="priority">${['عادي','عالية','عاجلة','منخفضة'].map(v=>`<option ${t.priority===v?'selected':''}>${v}</option>`).join('')}</select></label><label>التعليمات<textarea data-t="notes">${workEsc(t.notes||'')}</textarea></label><label><input type="checkbox" data-t="workdays_only" ${t.workdays_only!==false?'checked':''}> أيام دوام الموظف فقط</label></div><button type="button" onclick="this.closest('fieldset').remove()">حذف القالب</button></fieldset>`).join('')}
function readWorkTemplates(root){return [...root.querySelectorAll('[data-template-key]')].map(row=>{let t={key:row.dataset.templateKey};row.querySelectorAll('[data-t]').forEach(el=>t[el.dataset.t]=el.type==='checkbox'?el.checked:el.value);return t})}
function readWorkEditor(id){const root=document.getElementById(id),cfg={};for(const key of ['instructions','permissions','notifications','completion_fields']){if(root.dataset.individual==='1'&&!root.querySelector(`[data-override="${key}"]`).checked)continue;if(workLabels[key]){cfg[key]={};Object.keys(workLabels[key]).forEach(k=>cfg[key][k]=root.querySelector(`[data-work="${key}.${k}"]`).checked)}else{let v=root.querySelector(`[data-work="${key}"]`).value;cfg[key]=key==='completion_fields'?v.split('\n').map(x=>x.trim()).filter(Boolean):v}}if(root.dataset.individual!=='1')cfg.task_templates=readWorkTemplates(root);return cfg}
</script>
