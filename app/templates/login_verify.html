<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ company.name }} | تأكيد الدخول</title>
<link rel="stylesheet" href="/static/bim-ds.css?v={{ asset_v }}">
</head>
<body class="ds ds-login bim-login-page">
<main class="ds-login-card">
  <section class="ds-login-side">
    <div>
      <span class="ds-brand-logo"><img src="{{ '/company-logo' if company.logo else '/static/bim-logo-trim.png' }}" alt="{{ company.name }}"></span>
      <h2>{{ company.name }}</h2>
      <p>منصة {{ company.name }} لإدارة المهام والموظفين والمتابعة التشغيلية.</p>
    </div>
    <p>إدارة العمل والمهام</p>
  </section>
  <form class="ds-login-form login-panel" method="post" action="/login/verify" autocomplete="off">
    <h1>تأكيد الدخول</h1>
    <p>بعتنالك رمز من 6 أرقام على Telegram. اكتبه هون خلال 5 دقائق.</p>
    {% if error %}<div class="errbox" role="alert">{{ error }}</div>{% endif %}
    <div class="field"><label for="code">رمز التأكيد</label><input id="code" name="code" inputmode="numeric" pattern="[0-9 ]{6,8}" maxlength="8" autocomplete="one-time-code" required autofocus></div>
    <button>تأكيد</button>
    <div class="ds-login-gate gate"><a href="/login">إلغاء والرجوع لتسجيل الدخول</a></div>
  </form>
</main>
</body></html>
