<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ company.name }} | تسجيل الدخول</title>
<link rel="stylesheet" href="/static/v2.css?v={{ asset_v }}">
</head>
<body class="v2">
{# New login (interface v2, owner 2026-11-23). Same form: username, password, POST /login. #}
<main class="v-login">
  <section class="v-login-brand">
    <div><img src="{{ '/company-logo' if company.logo else '/static/bim-logo-trim.png' }}" alt="{{ company.name }}">
      <h2>{{ company.name }}</h2><p>مهام الفريق ومتابعتها، بمكان واحد.</p></div>
    <small>البوابة: {{ 'خارجية' if gateway=='external' else 'داخلية' }}</small>
  </section>
  <section class="v-login-form">
    <form method="post" action="/login">
      <h1>تسجيل الدخول</h1><p>دخّل اسم المستخدم وكلمة السر.</p>
      {% if error %}<div class="v-err" role="alert">{{ error }}</div>{% endif %}
      <label class="v-field"><span>اسم المستخدم</span><input id="u" name="username" autocomplete="username" required autofocus></label>
      <label class="v-field"><span>كلمة السر</span><input id="p" name="password" type="password" autocomplete="current-password" required></label>
      <button class="vb primary">دخول</button>
    </form>
  </section>
</main>
</body></html>
