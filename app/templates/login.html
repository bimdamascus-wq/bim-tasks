<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ company.name }} | تسجيل الدخول</title>
<link rel="stylesheet" href="/static/bim-ds.css?v=2">
</head>
<body class="ds ds-login bim-login-page">
<main class="ds-login-card">
  <section class="ds-login-side">
    <div>
      <span class="ds-brand-logo"><img src="{{ '/company-logo' if company.logo else '/static/bim-logo-trim.png' }}" alt="{{ company.name }}"></span>
      <h2>{{ company.name }}</h2>
      <p>منصة {{ company.name }} لإدارة المهام والموظفين والمتابعة التشغيلية.</p>
    </div>
    <p>إدارة العمل والمهام</p>
  </section>
  <form class="ds-login-form login-panel" method="post" action="/login">
    <h1>تسجيل الدخول</h1>
    <p>أدخل بيانات حسابك للوصول إلى النظام.</p>
    {% if error %}<div class="errbox" role="alert">{{ error }}</div>{% endif %}
    <div class="field"><label for="u">اسم المستخدم</label><input id="u" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">كلمة المرور</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button>دخول إلى النظام</button>
    <div class="ds-login-gate gate">البوابة: {{ 'خارجية' if gateway=='external' else 'داخلية LAN' }}</div>
  </form>
</main>
</body></html>
