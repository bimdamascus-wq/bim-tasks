{% extends "base.html" %}{% block content %}<main class="page-shell"><section class="page-title"><div><h1>صحة النظام</h1><p>فحص السيرفر وقاعدة البيانات والدومين.</p></div><button class="btn-light" onclick="load()">فحص الآن</button></section><div class="bim-section"><div class="bim-section-body" id="state"></div></div></main>{% endblock %}{% block scripts %}<script>async function load(){const h=await fetch('/health').then(r=>r.json());state.innerHTML=`<div class="bim-sync-line"><b>السيرفر</b><span class="bim-pill green">${bimEsc(h.status)}</span></div><div class="bim-sync-line"><b>الإصدار</b><span>${bimEsc(h.version)}</span></div><div class="bim-sync-line"><b>البوابة</b><span>${bimEsc(h.gateway)}</span></div><div class="bim-sync-line"><b>الدومين</b><span dir="ltr">${bimEsc(h.domain)}</span></div><div class="bim-sync-line"><b>عدد المهام</b><span>${bimArDigits(h.tasks)}</span></div>`}load();</script>{% endblock %}
