{% extends "base.html" %}{% block head %}<style>.manage-table{min-width:1180px}.manage-table td,.manage-table th{padding:5px 6px!important;font-size:10.5px!important}.manage-table input,.manage-table select{min-height:31px!important;padding:4px 6px!important;font-size:11px!important}.manage-table .task-input{min-width:260px}.manage-table .employee-select{min-width:130px;color:#414b58!important;font-weight:950!important}.manage-table .actions{display:flex;gap:4px;white-space:nowrap}</style>{% endblock %}
{% block content %}<main class="page-shell"><section class="page-title"><div><h1>إدارة المهام</h1><p>تعديل إداري مباشر؛ الأسماء غير المطابقة تبقى بدون موظف حتى تختار أنت.</p></div><div class="toolbar"><input id="q" placeholder="بحث"><button class="btn-light" onclick="load()">تحديث</button></div></section><div class="bim-section"><div class="scroll-box"><table class="manage-table sticky-table"><thead><tr><th>#</th><th>الموظف</th><th>المهمة</th><th>الحالة</th><th>الأولوية</th><th>الموعد</th><th>التذكير</th><th>إجراء</th></tr></thead><tbody id="body"></tbody></table></div></div></main>{% endblock %}
{% block scripts %}
<script>document.documentElement.dataset.bimExcelPage="manage";</script>

<script>
let tasks=[],emps=[];async function load(){[tasks,emps]=await Promise.all([fetch('/api/tasks').then(r=>r.json()),fetch('/api/employees').then(r=>r.json())]);render()}function empOpts(id){return '<option value="">بدون موظف</option>'+emps.map(e=>`<option value="${e.id}" ${+e.id===+id?'selected':''}>${bimEsc(e.name)}</option>`).join('')}function remOpts(v){return ['بدون','مرة واحدة','كل ساعة','كل ساعتين','أسبوعياً','شهرياً','تاريخ محدد'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}function render(){let a=tasks.filter(t=>!q.value||(`${t.employee_name} ${t.title}`).includes(q.value));const counts={};a.forEach(t=>counts[t.employee_name]=(counts[t.employee_name]||0)+1);a.sort((x,y)=>(counts[y.employee_name]||0)-(counts[x.employee_name]||0)||y.id-x.id);body.innerHTML=a.map(t=>`<tr id="task-${t.id}"><td>${bimArDigits(t.id)}</td><td><select class="employee-select">${empOpts(t.employee_id)}</select></td><td><input class="task-input" value="${bimEsc(t.title)}"></td><td><select class="st">${['جديدة','بدأت','قيد التنفيذ','بانتظار','تم','ملغاة'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></td><td><select class="pr">${['منخفضة','عادي','عالية','عاجلة'].map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('')}</select></td><td><input class="due" type="datetime-local" value="${(t.due_at||'').slice(0,16)}"></td><td><button type="button" class="btn-sm btn-light rem-btn" onclick="remEdit(${t.id})" title="تعديل التذكير">🔔 ${bimEsc(t.reminder_label||'بدون')}</button></td><td><div class="actions"><button class="btn-sm" onclick="save(${t.id},this)">حفظ</button><button class="btn-sm btn-light" onclick="sendTg(${t.id})">Telegram</button><button class="btn-sm btn-danger" onclick="delTask(${t.id})">أرشفة</button></div></td></tr>`).join('')}
function remEdit(id){const t=tasks.find(x=>x.id===id);if(t)bimReminder.edit(t,load)}
async function save(id,btn){const tr=btn.closest('tr'),old=tasks.find(x=>x.id===id);try{await bimRequest('/api/tasks/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee_id:tr.querySelector('.employee-select').value||null,title:tr.querySelector('.task-input').value,status:tr.querySelector('.st').value,priority:tr.querySelector('.pr').value,due_at:tr.querySelector('.due').value||null})});bimToast('تم الحفظ');await load()}catch(e){bimToast(e.message,'err')}}
async function sendTg(id){try{const r=await bimRequest('/api/tasks/'+id+'/telegram',{method:'POST'});bimToast(r.ok?'تم الإرسال':'تعذر الإرسال: '+(r.error||'لا يوجد Chat ID'),r.ok?'ok':'err')}catch(e){bimToast(e.message,'err')}}async function delTask(id){if(!confirm('أرشفة المهمة؟ يمكن استعادتها لاحقًا.'))return;try{await bimRequest('/api/tasks/'+id,{method:'DELETE'});bimToast('تمت أرشفة المهمة');await load()}catch(e){bimToast(e.message,'err')}}q.oninput=render;load().then(()=>{if(location.hash){const x=document.querySelector(location.hash.replace('#','#task-'));if(x)x.scrollIntoView()}});
</script>{% endblock %}
